  <style>
    :root{
      --teal:#174445; --green:#0c855c; --warm:#e9e7e3; --white:#ffffff; --ink:#0e2929;
      --font-heading:'Cambo',Georgia,serif; --font-body:'Lato',-apple-system,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-family:var(--font-body);font-size:16px;line-height:1.6;color:#1a2424;background:var(--white)}
    body{min-height:100vh;display:flex;flex-direction:column}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:96px 24px}
    .card{max-width:640px}
    .eyebrow{font:700 .72rem/1.3 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:20px}
    h1{font-family:var(--font-heading);font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.15;color:var(--ink);margin-bottom:20px;text-wrap:balance}
    p{font-size:1.05rem;max-width:44ch;color:#3c4a4a;margin-bottom:32px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-block;padding:14px 24px;border-radius:8px;font-weight:700;text-decoration:none;
         transition:background .2s ease,border-color .2s ease,color .2s ease}
    .btn-primary{background:var(--teal);color:#fff}
    .btn-primary:hover{background:#123636}
    .btn-ghost{border:1.5px solid rgba(0,0,0,.14);color:var(--ink)}
    .btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
    a:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
    footer{border-top:1px solid rgba(0,0,0,.08);padding:24px;text-align:center;
           font-size:.82rem;color:#6b7776}
    footer a{color:var(--green);text-decoration:none}
    footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to the home page</a>
        <a class="btn btn-ghost" href="mailto:josh@snowark.com.au">Email me instead</a>
      </div>
    </div>
  </div>
  <footer>

</body>
